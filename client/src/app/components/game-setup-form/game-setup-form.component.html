<div class="form-container">
    <div class="formCard">
        <div class="block">
            <div class="block-heading">
                <div class="blockLabel">Mode de jeu</div>
                <p class="blockHint">Définissez l'objectif principal de la partie.</p>
            </div>

            <div class="choices choices-grid">
                <label class="choice choice-card" [class.selected]="mode === modeEnum.Classic">
                    <input type="radio" name="mode" [(ngModel)]="mode" [value]="modeEnum.Classic" />
                    <span class="choice-indicator" aria-hidden="true"></span>
                    <span class="choice-content">
                        <span class="choice-title">Classique</span>
                        <span class="choice-description">Affrontement standard avec exploration, objets et combats.</span>
                    </span>
                </label>

                <label class="choice choice-card" [class.selected]="mode === modeEnum.CTF">
                    <input type="radio" name="mode" [(ngModel)]="mode" [value]="modeEnum.CTF" />
                    <span class="choice-indicator" aria-hidden="true"></span>
                    <span class="choice-content">
                        <span class="choice-title">Capture The Flag</span>
                        <span class="choice-description">Mode en équipes centré sur la capture et la défense du drapeau.</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div class="block">
            <div class="block-heading">
                <div class="blockLabel">Taille de carte</div>
                <p class="blockHint">Choisissez l'espace de jeu selon le nombre de joueurs visé.</p>
            </div>

            <div class="choices">
                <label class="choice choice-card" [class.selected]="size === gridSizeEnum.Small">
                    <input type="radio" name="size" [(ngModel)]="size" [value]="gridSizeEnum.Small" />
                    <span class="choice-indicator" aria-hidden="true"></span>
                    <span class="choice-content">
                        <span class="choice-title">Petite</span>
                        <span class="choice-description">10×10, idéale pour 2 joueurs.</span>
                    </span>
                </label>

                <label class="choice choice-card" [class.selected]="size === gridSizeEnum.Medium">
                    <input type="radio" name="size" [(ngModel)]="size" [value]="gridSizeEnum.Medium" />
                    <span class="choice-indicator" aria-hidden="true"></span>
                    <span class="choice-content">
                        <span class="choice-title">Moyenne</span>
                        <span class="choice-description">15×15, adaptée à 2 à 4 joueurs.</span>
                    </span>
                </label>

                <label class="choice choice-card" [class.selected]="size === gridSizeEnum.Large">
                    <input type="radio" name="size" [(ngModel)]="size" [value]="gridSizeEnum.Large" />
                    <span class="choice-indicator" aria-hidden="true"></span>
                    <span class="choice-content">
                        <span class="choice-title">Grande</span>
                        <span class="choice-description">20×20, pensée pour 2 à 6 joueurs.</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="actions">
            <button class="primaryBtn" type="button" (click)="submit()">Créer le jeu</button>
        </div>
    </div>
</div>
