@if (errors.length) {
<div class="error-box constraints-box" role="alert" aria-live="polite">
    <ul class="constraint-list">
        @for (err of errors; track err) {
        <li class="constraint-item constraint-error">
            <span class="constraint-text">{{ err }}</span>
        </li>
        }
    </ul>
</div>
}
